name: build-mod

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.10.2"

  - name: Extract ZIP
    run: |
      mkdir extracted
      unzip -q -o lulu.zip -d extracted

  - name: Find and build project
    run: |
      BUILD_FILE=$(find extracted -name build.gradle -print -quit)

      if [ -z "$BUILD_FILE" ]; then
        echo "ERROR: build.gradle not found!"
        find extracted -maxdepth 4 -type f
        exit 1
      fi

      PROJECT_DIR=$(dirname "$BUILD_FILE")
      echo "Found project: $PROJECT_DIR"
      cd "$PROJECT_DIR"
      gradle build --no-daemon

  - name: Collect JAR
    run: |
      mkdir -p output
      find extracted -type f -path "*/build/libs/*.jar" -exec cp {} output/ \;
      ls -lh output/

  - uses: actions/upload-artifact@v4
    with:
      name: himel-ai-companion-jar
      path: output/*.jar
      if-no-files-found: error
